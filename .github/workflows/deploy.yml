# Mise en ligne automatique
# - Pull request : vérifie que le site se construit sans erreur (aucun secret utilisé)
# - Fusion dans main : construit le site et l'envoie sur l'hébergement Infomaniak (FTPS)
#   → les secrets (FTP, SMTP) sont dans l'environnement GitHub « production »,
#     accessible uniquement depuis la branche main (Settings → Environments).
#   → la publication ne s'active que lorsque la variable FTP_SERVER_DIR est définie.
name: Construire et publier

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

# Droits minimaux du jeton GitHub : lecture seule du dépôt
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# Actions figées sur une version précise (empreinte SHA) : Dependabot les met à jour chaque mois
jobs:
  # 1. Contrôles (pull requests et main)
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # historique complet : permet de comparer avec main
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Installer
        run: npm ci

      - name: Contrôler le code (types, composants)
        run: npm run check

      - name: Construire le site
        run: npm run build

      # Garde-fous : boîte photos vide, poids des images, aucune ressource externe,
      # liens internes, fichiers techniques (étiquette « technique » requise)
      - name: Vérifier
        run: npm run verifier
        env:
          AUTORISER_TECHNIQUE: ${{ contains(github.event.pull_request.labels.*.name, 'technique') }}

  # 2. Publication sur Infomaniak : uniquement main, après les contrôles
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.FTP_SERVER_DIR != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.sanso-concept.ch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Construire le site
        run: |
          npm ci
          npm run build

      # Fichier de configuration du formulaire, créé à partir des secrets (jamais dans le dépôt)
      - name: Configurer le formulaire de contact
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          CONTACT_TO: ${{ secrets.CONTACT_TO }}
        run: |
          node -e '
            const q = (s) => "\x27" + String(s ?? "").replace(/\\/g, "\\\\").replace(/\x27/g, "\\\x27") + "\x27";
            const php = `<?php\nreturn [\n  "smtp_host" => "mail.infomaniak.com",\n  "smtp_port" => 465,\n  "smtp_user" => ${q(process.env.SMTP_USER)},\n  "smtp_pass" => ${q(process.env.SMTP_PASSWORD)},\n  "destinataire" => ${q(process.env.CONTACT_TO)},\n];\n`;
            require("fs").writeFileSync("dist/contact-config.php", php);
          '
          rm -f dist/contact-config.example.php

      - name: Publier sur Infomaniak
        id: publier
        continue-on-error: true # une coupure FTP passagère arrive : 2e essai ci-dessous
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR }}

      - name: Attendre avant le 2e essai
        if: steps.publier.outcome == 'failure'
        run: sleep 30

      - name: Publier sur Infomaniak (2e essai)
        if: steps.publier.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR }}
